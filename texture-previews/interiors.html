<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Style C interiors</title>
<style>
  body { margin: 0; padding: 24px; background: #15171a; color: #d8d4cc; font: 14px/1.45 system-ui, sans-serif; }
  figure { margin: 0 0 32px; padding: 18px; background: #1f2226; border: 1px solid #2c3036; border-radius: 8px; width: max-content; }
  figure h2 { font-size: 17px; margin: 0 0 4px; }
  figure p { margin: 0 0 12px; max-width: 900px; color: #aaa59b; }
  .row { display: flex; gap: 18px; align-items: flex-start; }
  .row small { display: block; color: #8a857b; font-size: 11px; margin-top: 4px; }
  canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<div id="out"></div>
<script src="shared.js"></script>
<script src="baseline.js"></script>
<script src="styles.js"></script>
<script src="interiors.js"></script>
<script src="interiors-pixel.js"></script>
<script>
  // Real generator output, called exactly as useHexInteraction does (CR 3, hex size 30).
  const I = window.Interiors;
  const CASES = [
    { theme: 'dungeon', title: 'Dungeon', Gen: I.DungeonGenerator, w: 18, h: 14, blurb: 'Cut-stone flagstones and brick walls. Walls get a lit top and a brick south face, so rooms read as 3/4 view. Wall-mounted torches cast warm light, quantised to 4 levels with ordered dithering. Solid rock beyond the walls is void.' },
    { theme: 'cave', title: 'Cave', Gen: I.CaveGenerator, w: 18, h: 13, blurb: 'Cracked cellular rock floor, lumpy rock walls with layered faces. No torches: the only light comes from glowing cyan mushrooms near the walls and daylight at the exit.' },
    { theme: 'ruins', title: 'Ruins', Gen: I.RuinsGenerator, w: 18, h: 13, blurb: 'Outdoors, in daylight. Weathered flagstones with moss in the joints and missing stones grown over; broken stone walls; the impassable area is overgrowth with trees instead of black void.' },
    { theme: 'tower', title: 'Tower (ground floor)', Gen: I.TowerGenerator, w: 21, h: 9, blurb: 'Plank floors, dressed-stone masonry, torchlight. Outside the tower walls is a starry night sky.' },
    { theme: 'town', title: 'Town', Gen: I.TownGenerator, w: 24, h: 18, town: true, blurb: 'Cobbled roads, a paved square, grass with trees and flowers, fence rails. Each building gets one continuous roof (tile, slate, thatch or awning by building type) and a timber-framed south facade with windows and a door on its entrance hex.' },
  ];
  const out = document.getElementById('out');
  CASES.forEach((c, n) => {
    const gen = new c.Gen(); gen.setSeed('preview-' + c.theme);
    let map;
    if (c.town) map = gen.generate(c.w, c.h, { name: 'Preview', settlementSize: 'town' });
    else {
      map = gen.generate(c.w, c.h, 3);
      map.encounters = gen.placeEncounters(map, { cr: 3, type: c.theme, name: c.title });
      map.loot = gen.placeLoot(map);
      map.hexes.forEach(h => { if (h.content === 'hazard') h.content = null; }); // hazards are hidden until found
    }
    const fig = document.createElement('figure');
    fig.dataset.file = `${10 + n}-pixel-${c.theme}`;
    fig.innerHTML = `<h2>C. 16-bit Pixel Art: ${c.title}</h2><p>${c.blurb}</p>`;
    const row = document.createElement('div'); row.className = 'row';
    const add = (m, label) => {
      const wrap = document.createElement('div'); const cv = document.createElement('canvas');
      const t0 = performance.now(); INTERIOR_PIXEL.render(cv, m, c.theme); const ms = performance.now() - t0;
      wrap.appendChild(cv); const s = document.createElement('small'); s.textContent = `${label} (${ms.toFixed(0)} ms)`; wrap.appendChild(s);
      row.appendChild(wrap);
    };
    add(map, `Generated by ${c.Gen.name}`);
    if (!c.town) add(INTERIOR_PIXEL.samplerMap(), 'Tile sampler: water, chasm, rubble, stairs up/down, entrance, exit, chest, loot, encounter');
    fig.appendChild(row);
    out.appendChild(fig);
  });
  window.__done = true;
</script>
</body>
</html>
