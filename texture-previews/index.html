<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hexcrawler terrain texture candidates</title>
<style>
  body { margin: 0; padding: 24px; background: #15171a; color: #d8d4cc; font: 14px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9a958b; margin: 0 0 24px; }
  figure { margin: 0 0 32px; padding: 18px; background: #1f2226; border: 1px solid #2c3036; border-radius: 8px; width: max-content; }
  figure h2 { font-size: 17px; margin: 0 0 4px; }
  figure p { margin: 0 0 12px; max-width: 760px; color: #aaa59b; }
  .legend { display: flex; gap: 10px; margin-top: 12px; }
  .legend div { text-align: center; font-size: 11px; color: #9a958b; }
  .legend canvas { display: block; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<h1>Terrain texture candidates</h1>
<p class="sub">Same 11x8 sample map, hex radius 40px. Legend hexes are isolated single tiles at radius 44px.</p>
<div id="out"></div>
<script src="baseline.js"></script>
<script src="shared.js"></script>
<script src="styles.js"></script>
<script>
  const out = document.getElementById('out');
  const LETTER = Object.fromEntries(Object.entries(TX.KEYS).map(([k, v]) => [v, k]));
  const only = new URLSearchParams(location.search).get('style');
  for (const style of STYLES.filter(s => !only || s.id === only)) {
    const fig = document.createElement('figure');
    fig.dataset.style = style.id;
    fig.innerHTML = `<h2>${style.title}</h2><p>${style.blurb}</p>`;
    const board = TX.buildBoard(TX.MAP, 40, 4);
    const map = document.createElement('canvas');
    map.width = board.width; map.height = board.height;
    fig.appendChild(map);
    const t0 = performance.now();
    style.render(map, board);
    const ms = performance.now() - t0;
    const legend = document.createElement('div'); legend.className = 'legend';
    for (const key of TX.TERRAIN_ORDER) {
      const b = TX.buildBoard([LETTER[key]], 44, 2);
      const c = document.createElement('canvas'); c.width = b.width; c.height = b.height;
      style.render(c, b);
      const cell = document.createElement('div'); cell.appendChild(c); cell.append(key);
      legend.appendChild(cell);
    }
    fig.appendChild(legend);
    const note = document.createElement('p'); note.style.margin = '10px 0 0'; note.style.fontSize = '11px';
    note.textContent = `Full-map render: ${ms.toFixed(0)} ms (uncached, single thread)`;
    fig.appendChild(note);
    out.appendChild(fig);
  }
  window.__done = true;
</script>
</body>
</html>
